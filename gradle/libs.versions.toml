[versions]
agp            = "8.5.2"
kotlin         = "2.0.0"
coreKtx        = "1.13.1"
appcompat      = "1.7.0"
material       = "1.12.0"
constraintlayout = "2.1.4"
lifecycleService = "2.8.4"
cameraX        = "1.3.4"
coroutines     = "1.8.1"
activityKtx    = "1.9.1"

[libraries]
androidx-core-ktx          = { group = "androidx.core",            name = "core-ktx",                version.ref = "coreKtx" }
androidx-appcompat         = { group = "androidx.appcompat",       name = "appcompat",               version.ref = "appcompat" }
material                   = { group = "com.google.android.material", name = "material",              version.ref = "material" }
androidx-constraintlayout  = { group = "androidx.constraintlayout", name = "constraintlayout",       version.ref = "constraintlayout" }
lifecycle-service          = { group = "androidx.lifecycle",       name = "lifecycle-service",        version.ref = "lifecycleService" }
camera-core                = { group = "androidx.camera",          name = "camera-core",              version.ref = "cameraX" }
camera-camera2             = { group = "androidx.camera",          name = "camera-camera2",           version.ref = "cameraX" }
camera-lifecycle           = { group = "androidx.camera",          name = "camera-lifecycle",         version.ref = "cameraX" }
camera-video               = { group = "androidx.camera",          name = "camera-video",             version.ref = "cameraX" }
camera-view                = { group = "androidx.camera",          name = "camera-view",              version.ref = "cameraX" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android", version.ref = "coroutines" }
activity-ktx               = { group = "androidx.activity",        name = "activity-ktx",             version.ref = "activityKtx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
